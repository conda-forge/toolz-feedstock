schema_version: 1

context:
  version: "1.2.0"

package:
  name: toolz
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/t/toolz/toolz-${{ version }}.tar.gz
  sha256: 9667a038e9d6ecba37995e26cb2f59ec6420b6ad8dd9677de59db9b956b08490

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-git-versioning >=2.0
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - tlz
        - toolz
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: List processing tools and functional utilities
  license: BSD-3-Clause
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/toolz/

extra:
  recipe-maintainers:
    - hendrikmakait
    - jrbourbeau
    - mrocklin
    - eriknw
    - jcrist
    - jakirkham
    - ocefpaf
